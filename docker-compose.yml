services:
  app:
    build: .
    container_name: usmover
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5611:5611"
    volumes:
      # Persist sqlite database used by DATABASE_URL=sqlite:///./data.db
      - ./backend/data.db:/app/data.db
      # Required by backend/services/container_service.py to manage sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock