name: livemace-bench

services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: livemace-bench-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: livemace-bench-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-livemace_bench}
      MYSQL_USER: ${MYSQL_USER:-livemace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-livemace123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: livemace-bench-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-livemace}:${MYSQL_PASSWORD:-livemace123}@mysql:3306/${MYSQL_DATABASE:-livemace_bench}?charset=utf8mb4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-80}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-120}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      TOOL_CACHE_REDIS_URL: ${TOOL_CACHE_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5611:5611"
    volumes:
      # Required by backend/services/container_service.py to manage sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist backend log files to host directory
      - ./backend/logs:/app/backend/logs

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: livemace-bench-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
