services:
  app:
    build: .
    container_name: usmover
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5611:5611"
    volumes:
      # Persist sqlite database used by DATABASE_URL=sqlite:///./data.db
      - ./backend/data.db:/app/data.db
      # Required by backend/services/container_service.py to manage sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.usmover.rule=Host(`oaa.finan.club`)"
      - "traefik.http.routers.usmover.entrypoints=websecure"
      - "traefik.http.routers.usmover.tls.certresolver=letsencrypt"
      - "traefik.http.services.usmover.loadbalancer.server.port=5611"
    networks:
      - traefik

networks:
  traefik:
    external: true