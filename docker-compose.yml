services:
  mysql:
    image: mysql:8.4
    container_name: usmover-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alpha_arena}
      MYSQL_USER: ${MYSQL_USER:-alpha}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-alpha123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: usmover
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-alpha}:${MYSQL_PASSWORD:-alpha123}@mysql:3306/${MYSQL_DATABASE:-alpha_arena}?charset=utf8mb4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-80}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-120}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "80:5611"
      - "5611:5611"
    volumes:
      # Required by backend/services/container_service.py to manage sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mysql-data: