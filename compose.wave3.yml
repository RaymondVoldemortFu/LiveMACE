name: alpha-arena-wave3
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alpha_arena_wave3
      MYSQL_USER: wave3
      MYSQL_PASSWORD: ${WAVE3_DB_PASSWORD:?set WAVE3_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WAVE3_ROOT_PASSWORD:?set WAVE3_ROOT_PASSWORD}
    volumes:
      - wave3-mysql:/var/lib/mysql
    ports:
      - '127.0.0.1:13306:3306'
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.wave3
    restart: unless-stopped
    env_file: .wave3/runtime.env
    environment:
      WAVE3_PRODUCTION: 'true'
      DATABASE_URL: mysql+pymysql://wave3:${WAVE3_DB_PASSWORD}@mysql:3306/alpha_arena_wave3?charset=utf8mb4
      TOOL_CACHE_REDIS_URL: redis://redis:6379/0
      TOOL_CACHE_KEY_PREFIX: wave3:iex
      SANDBOX_INSTANCE: alpha-arena-wave3
    ports:
      - '127.0.0.1:15611:5611'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wave3-logs:/app/backend/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5611/api/ready', timeout=25)"]
      interval: 15s
      timeout: 26s
      retries: 20
    stop_grace_period: 120s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.wave3
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:15621:80'
volumes:
  wave3-mysql:
  wave3-logs:
