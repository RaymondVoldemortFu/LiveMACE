[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "websockets",
    "requests",
    "apscheduler",
    "pandas>=2.3.3",
    "ccxt>=4.0.0",
    "openai>=2.8.1",
    "pymysql>=1.1.1",
    "python-dotenv>=1.2.1",
    "docker>=7.1.0",
    "mem0ai>=1.0.1",
    "alpaca-py>=0.43.2",
    "torch",
    "sentence-transformers",
    "chromadb",
    "pinecone",
    "tiktoken>=0.12.0",
    "brightdata-sdk>=2.3.0",
    "redis",
    "matplotlib>=3.10.8",
    "jsonschema>=4.0",
    "packaging>=24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
]

[project.scripts]
alpha-arena = "benchmark.cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest",
    "black",
    "ruff",
    "fakeredis>=2.34.1",
]

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]
only-include = [
  "benchmark",
]

[tool.hatch.build]
include = [
  "benchmark/**/*.py",
  "benchmark/**/*.yaml",
  "benchmark/**/*.yml",
  "benchmark/**/*.json",
  "benchmark/**/*.txt",
]


# Keep the checked-in, catalog-loadable examples available after a wheel
# install.  The CLI also discovers this top-level resource in installed
# environments, so examples do not depend on the source checkout layout.
[tool.hatch.build.targets.wheel.force-include]
"../examples/extensions" = "examples/extensions"

[tool.hatch.build.targets.sdist.force-include]
"../examples/extensions" = "examples/extensions"

[tool.pytest.ini_options]
markers = [
    "integration: calls external HTTP APIs (requires .env credentials)",
    "slow: heavy subprocess/import tests (~1 min)",
]
