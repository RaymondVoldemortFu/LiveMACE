[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "websockets",
    "requests",
    "apscheduler",
    "pandas>=2.3.3",
    "ccxt>=4.0.0",
    "openai>=2.8.1",
    "pymysql>=1.1.1",
    "python-dotenv>=1.2.1",
    "docker>=7.1.0",
    "mem0ai>=1.0.1",
    "alpaca-py>=0.43.2",
    "torch",
    "sentence-transformers",
    "chromadb",
    "pinecone",
    "tiktoken>=0.12.0",
    "brightdata-sdk>=2.3.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

